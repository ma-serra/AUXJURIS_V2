version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.7.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./storage:/qdrant/storage
    command: ["qdrant", "--path", "/qdrant/storage"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-build
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - QDRANT_URL=http://qdrant:6333
    volumes:
      - ./backend/src:/app/src
      - ./public:/app/public
    depends_on:
      qdrant:
        condition: service_healthy
    command: ["npm", "run", "dev"]

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-build
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    command: ["npm", "run", "dev:frontend"]
    depends_on:
      - backend

volumes:
  qdrant_storage: